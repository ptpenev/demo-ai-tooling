services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: company-platform-app
    container_name: company-platform-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - platform-network

  web:
    image: nginx:alpine
    container_name: company-platform-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - platform-network

  db:
    image: postgres:16-alpine
    container_name: company-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - platform-network

  redis:
    image: redis:alpine
    container_name: company-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  db-data:
    driver: local
